<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <title>Concert Corner — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --lime:#7FD41A; --lime-bright:#9dff2e; --lime-deep:#5fa30f;
      --purple:#6a3fb5; --purple-bright:#9a5cff; --purple-deep:#1a0a2e;
      --oled:#000; --surface:#0d0817; --surface-2:#150d22;
      --text:#F4F1F8; --muted:#C7BEDA; --muted-2:#9a90b3;
      --line:rgba(154,92,255,.22); --line-strong:rgba(154,92,255,.45);
      --red:#ff4444; --amber:#ffcc66;
      --gutter:16px;
      --bar-h:170px;
      --display:"Barlow Condensed","Barlow",system-ui,sans-serif;
      --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html{color-scheme:dark;}
    body{
      background:var(--oled);color:var(--text);font-family:var(--body);
      min-height:100vh;
      padding-bottom:calc(var(--bar-h) + 24px);
    }
    button,select,input{font-family:inherit;}
    :focus-visible{outline:2px solid var(--lime-bright);outline-offset:2px;}

    /* ── Header ─────────────────────────────────────────────── */
    .header{
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;gap:12px;
      padding:calc(env(safe-area-inset-top) + 10px) var(--gutter) 10px;
      background:linear-gradient(180deg,rgba(6,3,10,.98),rgba(6,3,10,.9));
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
    .brand-mark{
      flex:0 0 auto;width:38px;height:38px;border-radius:11px;
      display:grid;place-items:center;font-size:20px;
      background:linear-gradient(135deg,rgba(157,255,46,.18),rgba(154,92,255,.28));
      border:1px solid var(--line-strong);
    }
    .brand-text{min-width:0;}
    .brand h1{
      font-family:var(--display);font-size:22px;line-height:1;font-weight:900;
      letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
      background:linear-gradient(92deg,var(--lime-bright),var(--purple-bright));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .brand p{font-size:11.5px;color:var(--muted-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tools-open{
      flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;
      display:inline-flex;align-items:center;gap:7px;
      font-size:13px;font-weight:800;letter-spacing:.03em;
      color:var(--text);background:rgba(255,255,255,.05);
      border:1px solid var(--line-strong);cursor:pointer;
    }
    .tools-open:active{background:rgba(154,92,255,.2);}

    /* ── GitHub token strip ─────────────────────────────────── */
    .token-bar{
      display:flex;flex-direction:column;gap:8px;
      padding:10px var(--gutter);
      background:rgba(255,204,68,.07);
      border-bottom:1px solid rgba(255,204,68,.25);
    }
    .token-bar.ok{background:rgba(127,212,26,.05);border-color:rgba(127,212,26,.18);}
    .token-status{font-size:12.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .token-status.ok{color:var(--lime);}
    .token-status.bad{color:var(--amber);}
    .token-status.ok::after{content:"tap to change";margin-left:auto;font-size:11px;font-weight:600;color:var(--muted-2);}
    .token-bar.ok.open .token-status.ok::after{content:"hide";}
    .token-fields{display:flex;gap:8px;}
    .token-bar.ok:not(.open) .token-fields{display:none;}
    .token-input{
      flex:1 1 auto;min-width:0;min-height:44px;
      background:#0d0720;color:var(--text);
      border:1px solid rgba(154,92,255,.4);border-radius:10px;
      padding:0 12px;font-size:16px;font-family:ui-monospace,monospace;
    }
    .token-save-btn{
      flex:0 0 auto;min-height:44px;padding:0 20px;border-radius:10px;border:none;cursor:pointer;
      background:var(--lime);color:#0a1500;font-weight:900;font-size:14px;
    }

    /* ── Stats strip ────────────────────────────────────────── */
    .stats{
      padding:10px var(--gutter);
      font-size:11.5px;color:var(--muted-2);font-weight:700;letter-spacing:.03em;
      white-space:nowrap;overflow-x:auto;scrollbar-width:none;
      border-bottom:1px solid rgba(255,255,255,.05);
    }
    .stats::-webkit-scrollbar{display:none;}
    .stats span{color:var(--lime);font-size:13px;}

    /* ── Buttons (shared) ───────────────────────────────────── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      min-height:48px;padding:0 16px;border-radius:14px;
      font-weight:800;font-size:14px;letter-spacing:.02em;white-space:nowrap;
      border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--text);
      cursor:pointer;transition:transform .08s,filter .14s,background .14s;
    }
    .btn:active:not(:disabled){transform:scale(.97);}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .btn.primary{
      background:linear-gradient(95deg,var(--lime-bright),var(--lime));color:#0a1500;
      border-color:rgba(157,255,46,.7);font-weight:900;
    }
    .btn.primary:hover:not(:disabled){filter:brightness(1.07);}
    .btn.danger{border-color:rgba(255,68,68,.45);background:rgba(255,68,68,.09);color:#ffb0b0;}
    .btn.danger:hover:not(:disabled){background:rgba(255,68,68,.2);}

    /* ── Cards ──────────────────────────────────────────────── */
    .grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:14px;padding:14px var(--gutter);
    }
    .card{
      position:relative;overflow:hidden;cursor:pointer;
      border-radius:18px;border:1.5px solid var(--line);
      background:linear-gradient(180deg,var(--surface-2),var(--surface));
      transition:border-color .15s,box-shadow .15s,transform .1s;
    }
    .card:active{transform:scale(.995);}
    .card.selected{
      border-color:var(--lime-bright);
      box-shadow:0 0 0 3px rgba(157,255,46,.16),0 8px 30px rgba(127,212,26,.14);
    }
    .card.rejected{opacity:.4;border-color:rgba(255,68,68,.35);}
    .card.rejected .card-overlay{display:flex;}
    .card-overlay{
      display:none;position:absolute;inset:0;z-index:10;border-radius:18px;
      align-items:center;justify-content:center;pointer-events:none;
      background:rgba(0,0,0,.6);
      font-family:var(--display);font-size:30px;font-weight:900;letter-spacing:.14em;color:var(--red);
    }

    .thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#100b1a;overflow:hidden;}
    .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
    .thumb-wrap::before{
      content:"";position:absolute;inset:auto 0 0 0;height:45%;pointer-events:none;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));
    }
    .card.selected .thumb-wrap::after{
      content:"✓";position:absolute;left:10px;bottom:10px;z-index:2;
      width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
      background:var(--lime-bright);color:#0a1500;font-size:17px;font-weight:900;
      box-shadow:0 2px 10px rgba(0,0,0,.5);
    }
    .thumb-badge{
      position:absolute;bottom:8px;right:8px;z-index:2;
      background:rgba(0,0,0,.85);color:#fff;font-size:12px;font-weight:800;
      padding:3px 8px;border-radius:6px;letter-spacing:.02em;
    }
    .thumb-new,.thumb-trusted{
      position:absolute;top:8px;z-index:2;
      font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;letter-spacing:.07em;text-transform:uppercase;
    }
    .thumb-new{left:8px;background:var(--lime-bright);color:#0a1500;}
    .thumb-trusted{right:8px;background:rgba(10,21,0,.82);color:var(--lime-bright);border:1px solid rgba(157,255,46,.5);}

    .card-body{padding:12px 14px 14px;}
    .card-title{
      font-weight:800;font-size:15px;line-height:1.3;color:var(--text);margin-bottom:6px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .card-meta{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:3px;}
    .card-meta span{color:var(--muted-2);}
    .card-channel{font-size:12px;color:var(--muted-2);margin-bottom:3px;}
    .card-channel.trusted{color:var(--lime);}
    .card-search-term{font-size:11px;color:#7d7496;margin-bottom:8px;}
    .card-folder-badge{
      display:inline-block;margin-bottom:10px;
      font-size:11px;font-weight:900;letter-spacing:.05em;
      color:var(--lime-bright);background:rgba(127,212,26,.12);
      border:1px solid rgba(127,212,26,.35);border-radius:999px;padding:3px 11px;
    }
    .card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .card-cb{width:24px;height:24px;accent-color:var(--lime);cursor:pointer;flex-shrink:0;}
    .card-yt{
      display:inline-flex;align-items:center;min-height:38px;padding:0 14px;
      font-size:13px;font-weight:800;color:#fff;text-decoration:none;border-radius:10px;
      background:linear-gradient(95deg,var(--purple-bright),var(--purple));
      border:1px solid rgba(154,92,255,.6);
    }
    .reason-select{
      flex:1 1 96px;min-width:88px;min-height:38px;
      font-size:12px;background:#0d0720;color:var(--muted);
      border:1px solid rgba(255,68,68,.3);border-radius:10px;padding:0 8px;cursor:pointer;
    }
    .reason-select:disabled{opacity:.3;cursor:default;}
    .card-reject-btn{
      margin-left:auto;min-height:38px;padding:0 14px;
      font-size:12.5px;font-weight:800;color:#ffb0b0;cursor:pointer;
      border-radius:10px;border:1px solid rgba(255,68,68,.4);background:rgba(255,68,68,.09);
    }
    .card-reject-btn:active{background:rgba(255,68,68,.24);}

    .empty{padding:60px var(--gutter);text-align:center;color:var(--muted-2);font-weight:700;font-size:15px;line-height:1.5;}
    .empty p{margin-top:8px;font-size:13px;font-weight:500;}
    .empty strong{color:var(--lime);}

    /* New-artist suggestions (markup injected by admin.js with inline styles) */
    #artistSuggestionsSection{padding:6px var(--gutter) 4px !important;}

    /* ── Sticky action bar ──────────────────────────────────── */
    .actionbar{
      position:fixed;left:0;right:0;bottom:0;z-index:200;
      padding:10px var(--gutter) calc(env(safe-area-inset-bottom) + 12px);
      background:linear-gradient(180deg,rgba(8,4,14,.94),rgba(0,0,0,.98));
      border-top:1px solid var(--line-strong);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      display:flex;flex-direction:column;gap:9px;
    }
    .bar-summary{font-size:12.5px;font-weight:800;letter-spacing:.03em;color:var(--muted);text-align:center;}
    .bar-summary b{color:var(--lime-bright);}
    .bar-summary i{font-style:normal;color:#ff8a8a;}
    .folder-wrap{display:flex;align-items:center;gap:10px;}
    .folder-label{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);}
    .folder-wrap select{
      flex:1 1 auto;min-width:0;min-height:44px;
      background:var(--purple-deep);color:var(--text);
      border:1px solid var(--line-strong);border-radius:12px;padding:0 12px;
      font-size:14px;font-weight:700;cursor:pointer;
    }
    .bar-buttons{display:grid;grid-template-columns:auto auto 1fr;gap:8px;}
    #approveBtn{font-size:16px;}

    /* ── Tools bottom sheet ─────────────────────────────────── */
    .sheet-backdrop{
      position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.72);
      opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .sheet{
      position:fixed;left:0;right:0;bottom:0;z-index:410;
      max-height:86vh;overflow-y:auto;overscroll-behavior:contain;
      padding:8px var(--gutter) calc(env(safe-area-inset-bottom) + 20px);
      background:var(--surface);border-top:1px solid var(--line-strong);
      border-radius:22px 22px 0 0;
      transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
      max-width:640px;margin:0 auto;
    }
    body.sheet-open .sheet-backdrop{opacity:1;pointer-events:auto;}
    body.sheet-open .sheet{transform:translateY(0);}
    .sheet-grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:4px auto 10px;}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
    .sheet-head h2{font-family:var(--display);font-size:22px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;}
    .sheet-close{
      min-width:44px;min-height:44px;border-radius:12px;font-size:18px;cursor:pointer;
      color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);
    }
    .tool-group{margin-top:14px;}
    .tool-group h3{
      font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted-2);margin:0 2px 8px;
    }
    .tool-group.danger h3{color:#ff8a8a;}
    .tool-btn{
      display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
      text-align:left;padding:12px 14px;margin-bottom:8px;min-height:56px;border-radius:14px;cursor:pointer;
      color:var(--text);background:rgba(255,255,255,.045);border:1px solid var(--line);
    }
    .tool-btn:active{background:rgba(154,92,255,.2);}
    .tool-btn .tool-name{font-size:14.5px;font-weight:800;}
    .tool-btn .tool-sub{font-size:12px;font-weight:500;color:var(--muted-2);line-height:1.35;}
    .tool-group.danger .tool-btn{border-color:rgba(255,68,68,.35);background:rgba(255,68,68,.06);}
    .tool-group.danger .tool-btn .tool-name{color:#ffb0b0;}
    .tool-group.danger .tool-btn:active{background:rgba(255,68,68,.2);}

    /* ── Progress log (bottom sheet style) ─────────────────── */
    .progress-overlay{
      display:none;position:fixed;inset:0;z-index:500;
      background:rgba(0,0,0,.82);align-items:flex-end;justify-content:center;
    }
    .progress-overlay.show{display:flex;}
    .progress-box{
      width:100%;max-width:560px;text-align:center;
      background:var(--surface);border:1px solid var(--line-strong);border-bottom:none;
      border-radius:22px 22px 0 0;
      padding:22px var(--gutter) calc(env(safe-area-inset-bottom) + 18px);
    }
    .progress-box h3{font-family:var(--display);font-size:22px;font-weight:900;letter-spacing:.06em;color:var(--lime-bright);margin-bottom:12px;}
    .progress-log{
      font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:11.5px;color:var(--muted);
      text-align:left;white-space:pre-wrap;word-break:break-word;
      max-height:42vh;overflow-y:auto;line-height:1.7;
      background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;
    }
    .progress-close{
      width:100%;min-height:50px;border-radius:14px;border:none;cursor:pointer;
      background:linear-gradient(95deg,var(--lime-bright),var(--lime));color:#0a1500;font-weight:900;font-size:16px;
    }

    /* ── Toast (sits above the action bar) ──────────────────── */
    .toast{
      position:fixed;left:50%;bottom:calc(var(--bar-h) + 14px);
      transform:translateX(-50%) translateY(140px);
      max-width:calc(100vw - 32px);
      font-weight:800;font-size:13.5px;padding:12px 22px;border-radius:999px;
      box-shadow:0 8px 28px rgba(0,0,0,.6);
      transition:transform .25s ease;z-index:9999;text-align:center;
    }
    .toast.show{transform:translateX(-50%) translateY(0);}

    @media (min-width:700px){
      :root{--gutter:24px;}
      .actionbar{padding-left:max(var(--gutter),calc((100vw - 900px)/2));padding-right:max(var(--gutter),calc((100vw - 900px)/2));}
    }
    @media (prefers-reduced-motion:reduce){
      *{transition:none !important;}
    }
  </style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🎸</div>
    <div class="brand-text">
      <h1>Concert Corner</h1>
      <p>Admin · tap cards to select · approve goes straight to GitHub</p>
    </div>
  </div>
  <button class="tools-open" id="toolsOpenBtn" aria-haspopup="dialog" aria-controls="toolsSheet">⚙ Tools</button>
</header>

<!-- GitHub token setup -->
<div class="token-bar" id="tokenBar">
  <div class="token-status" id="tokenStatus">⚠ GitHub token not set</div>
  <div class="token-fields">
    <input class="token-input" id="tokenInput" type="password" placeholder="Paste GitHub PAT token…" autocomplete="off"/>
    <button class="token-save-btn" id="tokenSaveBtn">Save</button>
  </div>
</div>

<div class="stats" id="stats">Loading…</div>
<div class="grid"  id="grid"></div>

<!-- Sticky action bar -->
<div class="actionbar" id="actionBar">
  <div class="bar-summary" id="barSummary">Tap cards to select</div>
  <label class="folder-wrap">
    <span class="folder-label">Auto folder</span>
    <select id="folderSelect" aria-label="Folder (auto-picked from selected cards)">
      <option value="Live Concerts">🎤 Live Concerts</option>
      <option value="Acoustic Collection">🎸 Acoustic Collection</option>
      <option value="MTV Unplugged">📺 MTV Unplugged</option>
      <option value="Tiny Desk">🎙 Tiny Desk</option>
      <option value="Stitched Streams / Full Sessions">🎛 Stitched Streams / Full Sessions</option>
      <option value="Joey's Picks">🎧 Joey's Picks</option>
      <option value="Recently Added">🆕 Recently Added</option>
    </select>
  </label>
  <div class="bar-buttons">
    <button class="btn" id="selectAllBtn">☑ All</button>
    <button class="btn danger" id="rejectBtn">🗑 Reject</button>
    <button class="btn primary" id="approveBtn">✅ Approve</button>
  </div>
</div>

<!-- Tools sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<section class="sheet" id="toolsSheet" role="dialog" aria-modal="true" aria-labelledby="toolsTitle" aria-hidden="true">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <h2 id="toolsTitle">Tools</h2>
    <button class="sheet-close" id="sheetCloseBtn" aria-label="Close tools">✕</button>
  </div>

  <div class="tool-group">
    <h3>Organize</h3>
    <button class="tool-btn" id="sortBtn" onclick="sortAndFixFolders()">
      <span class="tool-name">🔤 Sort All Alphabetically</span>
      <span class="tool-sub">A–Z inside every folder</span>
    </button>
    <button class="tool-btn" id="groupLetterBtn" onclick="groupByLetter()">
      <span class="tool-name">🔡 Group Live Concerts A-Z</span>
      <span class="tool-sub">Letter folders (A, B, C…) inside Live Concerts</span>
    </button>
    <button class="tool-btn" id="mergeDupesBtn" onclick="mergeDuplicateFolders()">
      <span class="tool-name">🔀 Merge Duplicate Folders</span>
      <span class="tool-sub">Combine folders that differ only by emoji</span>
    </button>
    <button class="tool-btn" id="cleanStitchedBtn" onclick="cleanupStitchedStreams()">
      <span class="tool-name">🧹 Clean Up Stitched Streams</span>
      <span class="tool-sub">Move Unplugged / Tiny Desk items home, drop dupes</span>
    </button>
  </div>

  <div class="tool-group">
    <h3>Queue &amp; backup</h3>
    <button class="tool-btn" id="clearReviewedBtn">
      <span class="tool-name">🧹 Clear Reviewed</span>
      <span class="tool-sub">Hide selected / rejected cards from this view only</span>
    </button>
    <button class="tool-btn" id="exportBtn">
      <span class="tool-name">💾 Export Backup</span>
      <span class="tool-sub">Download pending queue + history as JSON</span>
    </button>
    <button class="tool-btn" id="restoreBtn" onclick="restoreFromHistory()">
      <span class="tool-name">🔁 Restore From Approved History</span>
      <span class="tool-sub">Re-add approved videos missing from episodes.json</span>
    </button>
  </div>

  <div class="tool-group danger">
    <h3>Danger zone</h3>
    <button class="tool-btn" id="clearPendingBtn">
      <span class="tool-name">⚠ Clear All Pending</span>
      <span class="tool-sub">Empties the candidate queue on GitHub</span>
    </button>
    <button class="tool-btn" id="resetRejectedBtn">
      <span class="tool-name">🔄 Reset Rejected History</span>
      <span class="tool-sub">Rejected videos can resurface in discovery</span>
    </button>
    <button class="tool-btn" id="removeArtistsBtn" onclick="removeArtistsFolder()">
      <span class="tool-name">🗑 Remove Artists Folder</span>
      <span class="tool-sub">Migrates 🎸 Artists content into Stitched Streams</span>
    </button>
  </div>
</section>

<!-- Approve / tool progress log -->
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-box">
    <h3 id="progressTitle">Running approval…</h3>
    <div class="progress-log" id="progressLog"></div>
    <button class="progress-close" id="progressClose" style="display:none">Done ✓</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // UI-only helpers (tools sheet, token strip, action-bar height). All app logic lives in admin.js.
  (function () {
    var body = document.body;
    var sheet = document.getElementById("toolsSheet");
    function openSheet()  { body.classList.add("sheet-open");    sheet.setAttribute("aria-hidden", "false"); }
    function closeSheet() { body.classList.remove("sheet-open"); sheet.setAttribute("aria-hidden", "true"); }

    document.getElementById("toolsOpenBtn").addEventListener("click", openSheet);
    document.getElementById("sheetCloseBtn").addEventListener("click", closeSheet);
    document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
    // Close the sheet as soon as a tool is tapped so its progress log / confirm dialog is visible.
    sheet.addEventListener("click", function (e) { if (e.target.closest(".tool-btn")) closeSheet(); });

    // Tap the token status line to show/hide the token field once a token is saved.
    var tokenBar = document.getElementById("tokenBar");
    document.getElementById("tokenStatus").addEventListener("click", function () {
      if (tokenBar.classList.contains("ok")) tokenBar.classList.toggle("open");
    });

    // Keep page padding and toast position matched to the real action-bar height.
    var bar = document.getElementById("actionBar");
    function syncBarHeight() {
      document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
    }
    syncBarHeight();
    if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe(bar);
    window.addEventListener("resize", syncBarHeight);
  })();
</script>
<script src="./admin.js"></script>
</body>
</html>
